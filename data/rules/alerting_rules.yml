groups:
  - name: express_api_alerts
    rules:
      - alert: ExpressApiDown
        expr: up{job="express-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Express API is unavailable
          description: Prometheus has been unable to scrape the API for one minute.

      - alert: ExpressApiHighErrorRate
        expr: job:http_errors:ratio5m{job="express-api"} > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Express API has a high server-error rate
          description: More than 5% of requests have returned 5xx responses for ten minutes.

      - alert: ExpressApiHighLatency
        expr: job:http_request_duration_seconds:p95_5m{job="express-api"} > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Express API p95 latency is high
          description: The five-minute p95 request latency has exceeded one second for ten minutes.
