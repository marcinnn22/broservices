global:
  resolve_timeout: 5m

route:
  receiver: api-webhook
  group_by: ["alertname", "service"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: api-webhook
    webhook_configs:
      - url: http://api:4300/monitoring/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: local-alertmanager-token-change-before-deploying
