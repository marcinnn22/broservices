global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: express-api
    metrics_path: /monitoring/metrics
    authorization:
      type: Bearer
      credentials: local-prometheus-metrics-token-change-before-deploying
    static_configs:
      - targets: ["api:4300"]
