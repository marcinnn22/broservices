name: Bug report
description: Report a reproducible defect in the boilerplate
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not report vulnerabilities here; use the private security form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Include operating system, Node.js, pnpm, PostgreSQL, and Docker versions as relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, tokens, cookies, email addresses, and database parameters.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report does not contain a security vulnerability or sensitive data.
          required: true
